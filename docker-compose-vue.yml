  vue:
    image: tritrics/ahoi-plainkit-vue
    pull_policy: build # never pull the outdated image of the same name from Docker Hub
    container_name: ahoi-plainkit-vue
    build:
      context: ./vue
    ports:
      - 8080:8080
    volumes:
      - ./vue:/srv/app
      - /srv/app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development
    tty: true