  kirby:
    build:
      context: ./kirby
    image: tritrics/ahoi-plainkit-kirby
    pull_policy: build # never pull the outdated image of the same name from Docker Hub
    container_name: ahoi-plainkit-kirby
    ports:
      - '8081:80'
    volumes:
      - ./kirby/public:/var/www/html
      - ./kirby/log:/var/log/apache2